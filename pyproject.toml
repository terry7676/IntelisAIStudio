[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "intelisai_studio"
version = "0.3.0"
description = "IntelisAi Studio local-first AI operating system foundation for Windows."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "PySide6>=6.7.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]
media = [
  "torch",
  "diffusers[torch]",
  "transformers",
  "accelerate",
]

[project.scripts]
terrygpt = "terrygpt.__main__:main"
terrygpt-server = "terrygpt.api.server:main"

[tool.setuptools.packages.find]
where = ["src"]
