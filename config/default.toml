[database]
path = "data/intelisai.sqlite"

[logging]
path = "data/logs/intelisai.log"
level = "INFO"

[ollama]
base_url = "http://127.0.0.1:11434"
default_model = ""
request_timeout_seconds = 120

[brain]
default_provider = "ollama"
default_model = ""
temperature = 0.7
top_p = 0.9
maximum_tokens = 2048
streaming_enabled = true
memory_enabled = true
system_prompt = "You are IntelisAi Studio, a local-first assistant running on the user's PC."

[api]
host = "127.0.0.1"
port = 8765
token_path = "data/secrets.toml"

[plugins]
directory = "plugins"

[desktop]
start_api_with_desktop = false

[hardware]
gpu_enabled = true
cpu_threads = 0
memory_limit_mb = 0

[security]
require_confirmation = true
allow_terminal_commands = false
api_enabled = false

[theme]
name = "IntelisAi Studio Dark"
accent_color = "#3b82f6"

[voice]
speech_to_text_enabled = false
text_to_speech_enabled = false

[media]
enabled = true
default_provider = "stable_diffusion"
output_directory = "data/media"
model_id = "runwayml/stable-diffusion-v1-5"
num_inference_steps = 40
guidance_scale = 8.0
negative_prompt = "blurry, low quality, black image, dark, distorted, deformed, cropped, watermark, text"
